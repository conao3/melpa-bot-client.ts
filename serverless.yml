service:
  name: melpa-bot-client

# Add the serverless-webpack plugin
plugins:
  - serverless-webpack
  - serverless-express
  - serverless-offline

provider:
  name: aws
  runtime: nodejs24.x

functions:
  melpa-bot-client:
    handler: handler.api
    events:
      - http:
          path: /{proxy+}
          method: ANY
